name: iaiep

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://iaiep:iaiep@postgres:5432/iaiep
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      # Local development credentials only.
      POSTGRES_USER: iaiep
      POSTGRES_PASSWORD: iaiep
      POSTGRES_DB: iaiep
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaiep -d iaiep"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data

volumes:
  postgres-data:
  nats-data:
