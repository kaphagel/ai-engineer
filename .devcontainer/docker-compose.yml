name: iaiep

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    # Secrets such as ANTHROPIC_API_KEY come from the git-ignored ../.env, if it exists.
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://iaiep:iaiep@postgres:5432/iaiep
      NATS_URL: nats://nats:4222
      # Development model server (ADR-0002); override by setting these in ../.env.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://192.168.10.41:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:30b-a3b}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      # Local development credentials only.
      POSTGRES_USER: iaiep
      POSTGRES_PASSWORD: iaiep
      POSTGRES_DB: iaiep
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaiep -d iaiep"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data

volumes:
  postgres-data:
  nats-data:
