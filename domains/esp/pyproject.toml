[project]
name = "iaiep-esp"
version = "0.1.0"
description = "IAIEP equipment domain: electrostatic precipitators (ESP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "iaiep",
    "pydantic>=2.8",
    "ezdxf>=1.3",
    "pypdf>=5.0",
]

[project.scripts]
iaiep-hopper = "iaiep_esp.hopper.cli:main"

[tool.uv.sources]
iaiep = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
