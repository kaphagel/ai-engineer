# Hopper input set: SYNTHETIC example data (spec D-16: safe for any model provider).
# Values are realistic in size but invented; they do not describe a real project.
schema_version = 1
data_classification = "public"

[parameters]
top_length_outside_mm = { value = 8000, source = "synthetic" }
top_width_outside_mm = { value = 3800, source = "synthetic" }
slot_length_inside_mm = { value = 6500, source = "synthetic" }
slot_width_inside_mm = { value = 400, source = "synthetic" }
height_mm = { value = 4200, source = "synthetic" }
end_wall_vertical_height_mm = { value = 1200, source = "synthetic" }
tier_heights_mm = { value = [1200, 1500, 1500], source = "synthetic" }
plate_thickness_mm = { value = 5, source = "synthetic" }
panel_gap_mm = { value = 20, source = "synthetic" }
top_gap_mm = { value = 5, source = "synthetic" }

[material]
designation = "S235JR"
standard = "EN 10025-2"
density_kg_m3 = { value = 7850, source = "synthetic" }

# Rolled sections. The mass per metre is used for the BOM; the dimensions only shape the 3D model.
[profiles.UPN200]
kind = "channel"
designation = "UPN 200"
standard = "EN 10279"
material = "S355JR EN 10025-2"
depth_mm = 200
width_mm = 75
web_thickness_mm = 8.5
flange_thickness_mm = 11.5
mass_per_m_kg = 25.3
source = "synthetic: typical catalogue values, not checked"

[profiles.UPN160]
kind = "channel"
designation = "UPN 160"
standard = "EN 10279"
material = "S355JR EN 10025-2"
depth_mm = 160
width_mm = 65
web_thickness_mm = 7.5
flange_thickness_mm = 10.5
mass_per_m_kg = 18.8
source = "synthetic: typical catalogue values, not checked"

[profiles.L75x50x6]
kind = "angle"
designation = "L 75x50x6"
standard = "EN 10056-1"
material = "S355JR EN 10025-2"
depth_mm = 75
width_mm = 50
web_thickness_mm = 6
flange_thickness_mm = 6
mass_per_m_kg = 5.65
source = "synthetic: typical catalogue values, not checked"

[profiles.L100x65x7]
kind = "angle"
designation = "L 100x65x7"
standard = "EN 10056-1"
material = "S355JR EN 10025-2"
depth_mm = 100
width_mm = 65
web_thickness_mm = 7
flange_thickness_mm = 7
mass_per_m_kg = 8.77
source = "synthetic: typical catalogue values, not checked"

[profiles.HEB160]
kind = "h_section"
designation = "HE 160 B"
standard = "EN 10365"
material = "S355JR EN 10025-2"
depth_mm = 160
width_mm = 160
web_thickness_mm = 8
flange_thickness_mm = 13
mass_per_m_kg = 42.6
source = "synthetic: typical catalogue values, not checked"

# Tier beams at every tier joint.
[stiffening.tier_beams]
side_profile = "UPN200"
end_profile = "UPN160"
side_end_extension_mm = 10
end_end_extension_mm = 10
source = "synthetic"

# Top beams on the top edge, split at the side support columns.
[stiffening.top_beams]
side_profile = "UPN200"
end_profile = "UPN160"
side_end_extension_mm = -10
end_end_extension_mm = 5
split_at_columns = true
source = "synthetic"

# Support column stubs on the hopper perimeter: corner columns at the offsets outside the outer
# plate faces, equal bays between them.
[stiffening.supports]
column_bays = 3
corner_offset_x_mm = 125
side_offset_y_mm = 100
stub_profile = "HEB160"
stub_length_mm = 700
column_plate_top_above_top_mm = 8.5
corner_column_plate_mm = [220, 220, 15]
side_column_plate_mm = [220, 190, 15]
side_column_plate_outward_offset_mm = 15
base_plate_mm = [280, 280, 20]
plate_material = "S355JR EN 10025-2"
source = "synthetic"

# Stiffener layout rules (used for every wall and tier without an explicit [[stiffening.stiffeners]]
# layout): heavy stiffeners on the side walls at the support column lines, the rest evenly spaced at
# most max_spacing_mm apart. Design decisions: not approved (spec §30.2, E-02).
[stiffening.rules]
standard_profile = "L75x50x6"
column_profile = "L100x65x7"
approved = false
source = "synthetic example rule"
spacing = [
  { wall = "side", position = "bottom", max_spacing_mm = 900, bottom_clearance_mm = 0, top_extension_mm = 10 },
  { wall = "side", position = "middle", max_spacing_mm = 1150, bottom_clearance_mm = 0, top_extension_mm = 10 },
  { wall = "side", position = "top", max_spacing_mm = 1000, bottom_clearance_mm = 0, top_extension_mm = -20 },
  { wall = "end", position = "bottom", max_spacing_mm = 700, bottom_clearance_mm = 150, top_extension_mm = 10 },
  { wall = "end", position = "middle", max_spacing_mm = 1500, bottom_clearance_mm = 0, top_extension_mm = 10 },
  { wall = "end", position = "top", max_spacing_mm = 1100, bottom_clearance_mm = 0, top_extension_mm = -20 },
]

# Engineering decisions: from the approved design basis only (spec §30.2, E-02/E-03).
[design_basis]
general_tolerances = { value = "TBC (E-03)", source = "placeholder" }
standard_notes = { value = [], source = "placeholder" }
min_valley_angle_deg = { value = 55, source = "placeholder, not an approved design criterion", approved = false }

